---
layout: default
---

<script>
window.__SITE_DATA__ = {
  posts: [
    {% assign timeline_posts = site.posts | where_exp: "post", "post.timeline != false" %}
    {% for post in timeline_posts %}
    {
      "title": {{ post.title | jsonify }},
      "date": "{{ post.date | date: '%Y-%m-%d' }}",
      "type": {{ post.type | jsonify }},
      "tags": {{ post.tags | jsonify }},
      "clickable": {% if post.clickable == nil %}true{% else %}{{ post.clickable }}{% endif %},
      "url": "{{ post.url | relative_url }}",
      "project": {{ post.project | jsonify }},
      "image": {{ post.image | jsonify }},
      "excerpt": {{ post.excerpt | strip_html | truncatewords: 50 | jsonify }},
      "start": {% if post.start %}"{{ post.start | date: '%Y-%m-%d' }}"{% else %}null{% endif %},
      "end": {% if post.end %}"{{ post.end | date: '%Y-%m-%d' }}"{% else %}null{% endif %}
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ],
  projects: {{ site.data.projects | jsonify }}
};
</script>

<div class="tag-filter" id="tag-filter" aria-label="Tag filters">
  <div class="tag-filter__tags" id="tag-filter-tags" role="group" aria-label="Filter by tag"></div>
  <button class="tag-filter__clear" id="tag-filter-clear">Clear filters</button>
</div>

<div class="timeline-wrapper">
  <div class="timeline" id="timeline" aria-live="polite" aria-label="Posts timeline"></div>
  <div class="project-bars" id="project-bars" aria-hidden="true"></div>
</div>

{{ content }}
